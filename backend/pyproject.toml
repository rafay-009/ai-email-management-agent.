[project]
name = "inboxpilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2,<3", "alembic>=1.15", "pydantic>=2,<3", "langgraph>=1,<2", "openai>=2,<3", "cryptography>=44", "httpx>=0.28,<1", "python-dotenv>=1", "psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 105
